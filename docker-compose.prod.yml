services:
  mysql:
    image: mysql:8.4
    container_name: langchain-prod-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: hello
      MYSQL_INITDB_SKIP_TZINFO: '1'
    command: 
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb_buffer_pool_size=256M
      - --innodb_log_file_size=64M
      - --innodb_flush_log_at_trx_commit=2
      - --max_connections=100
      - --wait_timeout=60
      - --interactive_timeout=60
      - --performance-schema=0
    volumes:
      - /opt/nest-langchain/volumes/mysql:/var/lib/mysql
    restart: always
    networks:
      - langchain-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7.4-alpine
    container_name: langchain-prod-redis
    env_file:
      - /etc/secrets/redis.prod
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --requirepass "$$REDIS_PASSWORD"
        --maxmemory 128mb
        --maxmemory-policy noeviction
    volumes:
      - /opt/nest-langchain/volumes/redis:/data
    restart: always
    networks:
      - langchain-network
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 64M

  nest-app:
    container_name: langchain-prod-nest-app
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - /etc/secrets/env.prod
      - /etc/secrets/redis.prod
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      NODE_OPTIONS: "--max-old-space-size=512"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - langchain-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  langchain-network:
    driver: bridge
    name: langchain-prod-network
